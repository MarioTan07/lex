# Every day at 02:00 Surabaya time (19:00 UTC), saves an encrypted copy of the live database and
# keeps it for 90 days under this repository's Actions → "Database backup" → the run → Artifacts.
# Needs three repository secrets: TURSO_DATABASE_URL, TURSO_AUTH_TOKEN and BACKUP_PASSWORD.
# See "Backups" in README.md.
name: Database backup
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Save the database
        run: |
          if [ -z "$BACKUP_PASSWORD" ]; then echo "BACKUP_PASSWORD secret is missing: refusing to save an unencrypted backup."; exit 1; fi
          node scripts/backup.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: semanggi-db-${{ github.run_id }}
          path: backups/*/semanggi.db.enc
          retention-days: 90
          if-no-files-found: error
